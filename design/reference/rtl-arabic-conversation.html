<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الكشك · المحادثة</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;family=Montserrat:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}*{box-sizing:border-box}p,h1,h2,h3{margin:0}
.root{font-family:'IBM Plex Sans Arabic','Montserrat',ui-sans-serif,system-ui,sans-serif;color:#144074;-webkit-font-smoothing:antialiased}
.en{font-family:'Montserrat',ui-sans-serif,system-ui,sans-serif}
button,input{font:inherit;color:inherit}
.stage{position:relative;overflow:hidden;background:#144074}
.blob{position:absolute;display:block;border-radius:50%;filter:blur(110px);opacity:.55}
.canvas{position:relative;background:#fff;display:flex;flex-direction:column;box-shadow:0 30px 90px rgba(10,30,70,.25)}
.seg{display:flex;background:#EEF2F7;border-radius:999px;gap:4px;padding:6px}
.seg button,.seg a{border:0;background:transparent;font-weight:600;color:#4E5F78;border-radius:999px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none;min-width:var(--segw);height:var(--segh);font-size:var(--segf)}
.seg .on{background:#144074;color:#fff}
.btn1{display:inline-flex;align-items:center;justify-content:center;background:#144074;color:#fff;border:0;border-radius:999px;font-weight:600;text-decoration:none;cursor:pointer}
.btn2{display:inline-flex;align-items:center;justify-content:center;background:#fff;color:#144074;border:1.5px solid #D9E2EC;border-radius:999px;font-weight:600;text-decoration:none;cursor:pointer}
.chip{display:inline-flex;align-items:center;background:#E8F2FB;color:#125D99;border-radius:999px;font-weight:600;white-space:nowrap}
.chip.empty{background:#fff;color:#6E7F96;border:1.5px dashed #C7D6E6}
.muted{color:#4E5F78}
.lbl{font-weight:700;color:#125D99}
.lbl::before{content:"";display:inline-block;width:.75em;height:.75em;border-radius:50%;background:#E5418C;margin-inline-end:.5em;vertical-align:-.06em}
.ring{display:inline-block;flex:none;border-radius:50%;background:conic-gradient(#2694CF 0 72%,#DFE9F3 72% 100%);-webkit-mask:radial-gradient(circle,transparent 52%,#000 54%);mask:radial-gradient(circle,transparent 52%,#000 54%)}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.orb{position:relative;border-radius:50%;flex:none}
.orb>i{position:absolute;display:block;border-radius:50%}
.orb .g{inset:-24%;background:radial-gradient(circle,rgba(38,148,207,.55) 0%,rgba(140,202,238,.22) 42%,rgba(140,202,238,0) 68%);filter:blur(16px)}
.orb .c{inset:0;background:radial-gradient(circle at 34% 28%,#fff 0%,#E2F2FC 12%,#8CCAEE 36%,#2694CF 64%,#144074 92%);box-shadow:inset 0 -20px 50px rgba(10,45,95,.32),inset 0 14px 30px rgba(255,255,255,.5)}
.orb .s{inset:8%;background:conic-gradient(from 0deg,rgba(255,255,255,0) 0deg,rgba(160,220,255,.85) 90deg,rgba(229,65,140,.35) 200deg,rgba(255,255,255,0) 300deg);filter:blur(10px);mix-blend-mode:screen;opacity:.75;animation:orbspin 14s linear infinite}
.orb .s2{inset:16%;background:conic-gradient(from 180deg,rgba(255,255,255,0) 0deg,rgba(130,205,255,.7) 120deg,rgba(239,142,10,.35) 220deg,rgba(255,255,255,0) 320deg);filter:blur(9px);mix-blend-mode:screen;animation:orbspin 9s linear infinite reverse}
.orb .h{top:8%;left:19%;width:42%;height:26%;background:radial-gradient(ellipse at center,rgba(255,255,255,.95),rgba(255,255,255,0) 70%);filter:blur(3px)}
.orb.speak{animation:orbspeak 1.4s ease-in-out infinite}.orb.speak .g{animation:orbglow 1.4s ease-in-out infinite}
.wave{display:flex;align-items:center}.wave i{display:block;background:#2694CF;border-radius:99px;animation:wv 1s ease-in-out infinite}
.spin{display:inline-block;flex:none;border-radius:50%;border-style:solid;border-color:#DCEBF7;border-top-color:#125D99;animation:orbspin .9s linear infinite}
@keyframes orbspin{to{transform:rotate(360deg)}}
@keyframes orbglow{0%,100%{opacity:.7}50%{opacity:1}}
@keyframes orbspeak{0%,100%{transform:scale(1)}12%{transform:scale(1.06)}24%{transform:scale(1.01)}36%{transform:scale(1.07)}52%{transform:scale(1)}68%{transform:scale(1.05)}84%{transform:scale(1.01)}}
@keyframes wv{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
</style>
<div class="root stage" dir="rtl" style="width: 1080px; height: 1920px; padding: 40px; --segw: 108px; --segh: 68px; --segf: 26px">
  <i class="blob" style="width: 820px; height: 820px; right: -260px; top: -220px; background: #2694CF"></i>
  <i class="blob" style="width: 760px; height: 760px; left: -300px; top: 560px; background: #125D99"></i>
  <i class="blob" style="width: 900px; height: 900px; right: -160px; bottom: -400px; background: #1EA5E0"></i>
  <div class="canvas" style="height: 100%; border-radius: 56px; padding: 44px 64px 40px">

    <header style="display: flex; align-items: center; justify-content: space-between; height: 88px">
      <img src="../assets/mcg-mark-color.png" alt="MCG" style="height: 60px; width: auto; display: block">
      <div style="display: flex; align-items: center; gap: 16px">
        <button class="btn2" style="height: 76px; padding: 0 30px; font-size: 26px; gap: 12px"><svg class="i" viewBox="0 0 24 24" style="font-size: 26px"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path></svg>من جديد</button>
        <div class="seg"><button class="on">عربي</button><a class="en" href="#" style="font-size: 24px">EN</a></div>
      </div>
    </header>

    <section style="margin-top: 48px; display: flex; flex-direction: column; gap: 18px">
      <div style="display: flex; justify-content: space-between; align-items: center"><span class="lbl" style="font-size: 26px">مشروعك</span><span class="en" style="font-size: 24px; font-weight: 700; color: #125D99">4 / 6</span></div>
      <div style="display: flex; flex-wrap: wrap; gap: 12px">
        <span class="chip" style="font-size: 26px; padding: 12px 22px; gap: 10px"><svg class="i" viewBox="0 0 24 24" style="stroke-width: 2.4"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>مقهى مختص</span>
        <span class="chip" style="font-size: 26px; padding: 12px 22px; gap: 10px"><svg class="i" viewBox="0 0 24 24" style="stroke-width: 2.4"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>زوار بالمسا</span>
        <span class="chip" style="font-size: 26px; padding: 12px 22px; gap: 10px"><svg class="i" viewBox="0 0 24 24" style="stroke-width: 2.4"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>موظفين شباب</span>
        <span class="chip" style="font-size: 26px; padding: 12px 22px; gap: 10px"><svg class="i" viewBox="0 0 24 24" style="stroke-width: 2.4"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>السالمية</span>
        <span class="chip empty" style="font-size: 26px; padding: 10px 22px; gap: 10px; border-color: #2694CF; color: #125D99"><span class="spin" style="width: 22px; height: 22px; border-width: 3px"></span>الميزانية</span>
        <span class="chip empty" style="font-size: 26px; padding: 10px 22px">التوقيت</span>
      </div>
    </section>

    <section style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 56px">
      <div class="orb speak" style="width: 260px; height: 260px"><i class="g"></i><i class="c"></i><i class="s"></i><i class="s2"></i><i class="h"></i></div>
      <p class="muted" style="font-size: 32px; font-weight: 500">«موظفين شباب، بعد الدوام»</p>
      <h1 style="font-size: 76px; line-height: 1.35; font-weight: 700; max-width: 860px; text-wrap: balance">كم ميزانيتك بالشهر؟</h1>
      <span class="wave" style="height: 40px; gap: 6px"><i style="width: 6px; height: 18px"></i><i style="width: 6px; height: 36px; animation-delay: -.4s"></i><i style="width: 6px; height: 26px; animation-delay: -.7s"></i><i style="width: 6px; height: 40px; animation-delay: -.2s"></i><i style="width: 6px; height: 22px; animation-delay: -.55s"></i></span>
    </section>

    <section style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
      <button class="btn2" style="height: 104px; font-size: 32px">أقل من 500 د.ك</button>
      <button class="btn2" style="height: 104px; font-size: 32px">500 – 1,500 د.ك</button>
      <button class="btn2" style="height: 104px; font-size: 32px">أكثر من 1,500 د.ك</button>
      <button class="btn2" style="height: 104px; font-size: 32px">مو متأكد</button>
    </section>

    <div style="margin-top: 32px; display: flex; justify-content: center">
      <button class="btn1" style="width: 640px; height: 140px; font-size: 42px; gap: 22px; box-shadow: 0 18px 40px rgba(20,64,116,.28)">
        <svg class="i" viewBox="0 0 24 24" style="font-size: 46px"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"></path><path d="M19 11a7 7 0 0 1-14 0M12 18v3"></path></svg>
        اضغط مطوّل وجاوب
      </button>
    </div>

    <footer class="muted" style="display: flex; justify-content: flex-end; align-items: center; gap: 12px; height: 56px; margin-top: 24px; font-size: 22px; font-weight: 500"><span class="ring" style="width: 28px; height: 28px"></span><span class="en">60s</span></footer>
  </div>
</div>
</body>
</html>
