<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPad · Questions</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<!-- PROPOSAL (Nov 2026): replaces 02-listening + 03-conversation. Tap-to-choose questions instead of voice.
     Shown: question 1 answered (Café selected), about to advance to question 2. Tapping a card advances after ~350 ms. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;family=Montserrat:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}*{box-sizing:border-box}p,h1,h2,h3{margin:0}
.root{font-family:'Montserrat',ui-sans-serif,system-ui,sans-serif;color:#144074;-webkit-font-smoothing:antialiased}
.ar{font-family:'IBM Plex Sans Arabic','Montserrat',sans-serif}
button,input{font:inherit;color:inherit}
.stage{position:relative;overflow:hidden;background:#144074}
.blob{position:absolute;display:block;border-radius:50%;filter:blur(90px);opacity:.55}
.canvas{position:relative;background:#fff;display:flex;flex-direction:column;box-shadow:0 20px 70px rgba(10,30,70,.25)}
.seg{display:flex;background:#EEF2F7;border-radius:999px;gap:3px;padding:4px}
.seg button,.seg a{border:0;background:transparent;font-weight:600;color:#4E5F78;border-radius:999px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none;min-width:72px;height:48px;font-size:16px}
.seg .on{background:#144074;color:#fff}
.btn1{display:inline-flex;align-items:center;justify-content:center;background:#144074;color:#fff;border:0;border-radius:999px;font-weight:600;text-decoration:none;cursor:pointer}
.btn2{display:inline-flex;align-items:center;justify-content:center;background:#fff;color:#144074;border:1.5px solid #D9E2EC;border-radius:999px;font-weight:600;text-decoration:none;cursor:pointer}
.muted{color:#4E5F78}
.lbl{font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#125D99}
.lbl::before{content:"";display:inline-block;width:.75em;height:.75em;border-radius:50%;background:#E5418C;margin-inline-end:.5em;vertical-align:-.06em}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.orb{position:relative;border-radius:50%;flex:none}
.orb>i{position:absolute;display:block;border-radius:50%}
.orb .g{inset:-24%;background:radial-gradient(circle,rgba(38,148,207,.55) 0%,rgba(140,202,238,.22) 42%,rgba(140,202,238,0) 68%);filter:blur(16px)}
.orb .c{inset:0;background:radial-gradient(circle at 34% 28%,#fff 0%,#E2F2FC 12%,#8CCAEE 36%,#2694CF 64%,#144074 92%);box-shadow:inset 0 -24px 56px rgba(10,45,95,.32),inset 0 16px 32px rgba(255,255,255,.5)}
.orb .s{inset:8%;background:conic-gradient(from 0deg,rgba(255,255,255,0) 0deg,rgba(160,220,255,.85) 90deg,rgba(229,65,140,.35) 200deg,rgba(255,255,255,0) 300deg);filter:blur(12px);mix-blend-mode:screen;opacity:.75;animation:orbspin 14s linear infinite}

.br{display:flex;align-items:center;gap:14px;height:56px;font-size:19px;font-weight:600;border-bottom:1px solid #EBF0F5}
.br:last-child{border-bottom:0}
.ok{width:30px;height:30px;border-radius:50%;background:#144074;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.br span:last-child{margin-inline-start:auto;font-weight:500;color:#4E5F78;font-size:17px}
.opt{display:flex;align-items:center;gap:16px;height:88px;padding:0 20px;background:#fff;border:1.5px solid #D9E2EC;border-radius:24px;font-size:19px;font-weight:600;color:#144074;cursor:pointer;text-align:start;transition:border-color .2s,box-shadow .2s,transform .2s}
.opt:active{transform:scale(.98)}
.opt .oi{width:52px;height:52px;border-radius:16px;background:#EEF5FB;color:#125D99;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.opt.on{border:2.5px solid #2694CF;box-shadow:0 0 0 6px rgba(38,148,207,.14)}
.opt.on .oi{background:#144074;color:#fff}
.bars{display:flex;gap:8px}.bars i{display:block;height:6px;flex:1;border-radius:99px;background:#E3EAF2}.bars i.on{background:#2694CF}
@keyframes orbspin{to{transform:rotate(360deg)}}
@keyframes orbglow{0%,100%{opacity:.7}50%{opacity:1}}
</style>
<div class="root stage" style="width: 1366px; height: 1024px; padding: 20px">
  <i class="blob" style="width: 700px; height: 700px; left: -220px; top: -260px; background: #2694CF"></i>
  <i class="blob" style="width: 640px; height: 640px; right: -240px; top: 300px; background: #125D99"></i>
  <i class="blob" style="width: 700px; height: 700px; left: 300px; bottom: -480px; background: #1EA5E0"></i>
  <div class="canvas" style="height: 100%; border-radius: 40px; padding: 28px 48px 36px">
    <header style="display: flex; align-items: center; justify-content: space-between; height: 64px">
      <img src="../assets/mcg-mark-color.png" alt="MCG" style="height: 44px; width: auto; display: block">
      <div style="display: flex; align-items: center; gap: 12px">
        <a class="btn2" href="01-welcome.html" style="height: 52px; padding: 0 20px; font-size: 16px; gap: 8px"><svg class="i" viewBox="0 0 24 24" style="font-size: 18px"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path></svg>Start over</a>
        <div class="seg"><button class="on">EN</button><button class="ar" style="font-size: 17px">عربي</button></div>
      </div>
    </header>

    <div style="flex: 1; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 56px; align-items: center">
      <div style="display: flex; flex-direction: column; gap: 28px">
        <div style="display: flex; align-items: center; gap: 18px">
          <div class="orb" style="width: 64px; height: 64px"><i class="g"></i><i class="c"></i><i class="s"></i><i class="s2"></i><i class="h"></i></div>
          <span class="lbl" style="font-size: 15px">Question 1 of 5</span>
        </div>
        <h1 style="font-size: 52px; line-height: 1.12; font-weight: 700; letter-spacing: -0.02em; text-wrap: balance">What's your business?</h1>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
          <button class="opt on"><span class="oi"><svg class="i" viewBox="0 0 24 24"><path d="M4 9h12v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"/><path d="M16 11h1.5a2.5 2.5 0 0 1 0 5H16"/><path d="M8 3.5c0 1 1 1.5 1 2.5M12 3.5c0 1 1 1.5 1 2.5"/></svg></span>Café &amp; coffee</button>
          <button class="opt"><span class="oi"><svg class="i" viewBox="0 0 24 24"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10"/><path d="M17 21V3c-2 1.5-3 4-3 7v3h3"/></svg></span>Restaurant</button>
          <button class="opt"><span class="oi"><svg class="i" viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg></span>Fashion &amp; retail</button>
          <button class="opt"><span class="oi"><svg class="i" viewBox="0 0 24 24"><path d="M12 3l1.8 4.7L18.5 9l-4.7 1.8L12 15.5l-1.8-4.7L5.5 9l4.7-1.3z"/><path d="M18 15l.8 2.2L21 18l-2.2.8L18 21l-.8-2.2L15 18l2.2-.8z"/></svg></span>Beauty &amp; salon</button>
          <button class="opt"><span class="oi"><svg class="i" viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg></span>Fitness</button>
          <button class="opt"><span class="oi"><svg class="i" viewBox="0 0 24 24"><path d="M4 21V9l8-5 8 5v12"/><path d="M9 21v-6h6v6"/></svg></span>Real estate</button>
          <button class="opt"><span class="oi"><svg class="i" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/><path d="M12 10v4M10 12h4"/></svg></span>Clinic &amp; health</button>
          <button class="opt"><span class="oi"><svg class="i" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="18" cy="12" r="1.2"/></svg></span>Other</button>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 24px">
        <div style="display: flex; justify-content: space-between; align-items: center"><span class="lbl" style="font-size: 14px">Your brief</span><span style="font-size: 16px; font-weight: 700; color: #125D99">1 / 5</span></div>
        <div class="bars"><i class="on"></i><i></i><i></i><i></i><i></i></div>
        <div style="border: 1px solid #E3EAF2; border-radius: 28px; padding: 8px 24px; background: #F7FAFD">
          <div class="br"><span class="ok"><svg class="i" viewBox="0 0 24 24" style="stroke-width: 2.6"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>Business<span>Café &amp; coffee</span></div>
          <div class="br" style="color: #125D99"><span class="spin" style="width: 30px; height: 30px; border-width: 3px"></span>Audience<span style="color: #125D99">Next</span></div>
          <div class="br" style="color: #8796AB"><span style="width: 30px; height: 30px; border-radius: 50%; border: 1.5px dashed #C7D6E6; flex: none"></span>Goal<span></span></div>
          <div class="br" style="color: #8796AB"><span style="width: 30px; height: 30px; border-radius: 50%; border: 1.5px dashed #C7D6E6; flex: none"></span>Challenge<span></span></div>
          <div class="br" style="color: #8796AB"><span style="width: 30px; height: 30px; border-radius: 50%; border: 1.5px dashed #C7D6E6; flex: none"></span>Area<span></span></div>
        </div>
        <p class="muted" style="font-size: 17px; font-weight: 500; text-align: center">Tap one to continue · you can change it later</p>
        <a class="btn2" href="01-welcome.html" style="height: 72px; font-size: 20px; gap: 10px"><svg class="i" viewBox="0 0 24 24" style="font-size: 22px"><path d="M15 6l-6 6 6 6"></path></svg>Back</a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
