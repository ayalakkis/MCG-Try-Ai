<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPad · Welcome</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;family=Montserrat:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}*{box-sizing:border-box}p,h1,h2,h3{margin:0}
.root{font-family:'Montserrat',ui-sans-serif,system-ui,sans-serif;color:#144074;-webkit-font-smoothing:antialiased}
.ar{font-family:'IBM Plex Sans Arabic','Montserrat',sans-serif}
button,input{font:inherit;color:inherit}
.stage{position:relative;overflow:hidden;background:#144074}
.blob{position:absolute;display:block;border-radius:50%;filter:blur(90px);opacity:.55}
.canvas{position:relative;background:#fff;display:flex;flex-direction:column;box-shadow:0 20px 70px rgba(10,30,70,.25)}
.seg{display:flex;background:#EEF2F7;border-radius:999px;gap:3px;padding:4px}
.seg button,.seg a{border:0;background:transparent;font-weight:600;color:#4E5F78;border-radius:999px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none;min-width:72px;height:48px;font-size:16px}
.seg .on{background:#144074;color:#fff}
.btn1{display:inline-flex;align-items:center;justify-content:center;background:#144074;color:#fff;border:0;border-radius:999px;font-weight:600;text-decoration:none;cursor:pointer}
.btn2{display:inline-flex;align-items:center;justify-content:center;background:#fff;color:#144074;border:1.5px solid #D9E2EC;border-radius:999px;font-weight:600;text-decoration:none;cursor:pointer}
.card{background:#fff;border:1px solid #E3EAF2;box-shadow:0 1px 2px rgba(16,42,80,.04),0 8px 24px rgba(16,42,80,.06)}
.muted{color:#4E5F78}
.grad{background:linear-gradient(90deg,#2694CF,#125D99);-webkit-background-clip:text;background-clip:text;color:transparent}
.dots{display:inline-flex;align-items:center;gap:.09em;margin-inline-start:.12em;vertical-align:baseline}
.dots i{display:block;width:.19em;height:.19em;border-radius:50%}
.dots i:nth-child(1){background:#EF8E0A}.dots i:nth-child(2){background:#E5418C}.dots i:nth-child(3){background:#1EA5E0}
.lbl{font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#125D99}
.lbl::before{content:"";display:inline-block;width:.75em;height:.75em;border-radius:50%;background:#E5418C;margin-inline-end:.5em;vertical-align:-.06em}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.bline{position:absolute;pointer-events:none;overflow:visible}
.orb{position:relative;border-radius:50%;flex:none}
.orb>i{position:absolute;display:block;border-radius:50%}
.orb .g{inset:-24%;background:radial-gradient(circle,rgba(38,148,207,.55) 0%,rgba(140,202,238,.22) 42%,rgba(140,202,238,0) 68%);filter:blur(16px)}
.orb .c{inset:0;background:radial-gradient(circle at 34% 28%,#fff 0%,#E2F2FC 12%,#8CCAEE 36%,#2694CF 64%,#144074 92%);box-shadow:inset 0 -30px 70px rgba(10,45,95,.32),inset 0 20px 40px rgba(255,255,255,.5)}
.orb .s{inset:8%;background:conic-gradient(from 0deg,rgba(255,255,255,0) 0deg,rgba(160,220,255,.85) 90deg,rgba(229,65,140,.35) 200deg,rgba(255,255,255,0) 300deg);filter:blur(14px);mix-blend-mode:screen;opacity:.75;animation:orbspin 14s linear infinite}
.orb .s2{inset:16%;background:conic-gradient(from 180deg,rgba(255,255,255,0) 0deg,rgba(130,205,255,.7) 120deg,rgba(239,142,10,.35) 220deg,rgba(255,255,255,0) 320deg);filter:blur(12px);mix-blend-mode:screen;animation:orbspin 9s linear infinite reverse}
.orb .h{top:8%;left:19%;width:42%;height:26%;background:radial-gradient(ellipse at center,rgba(255,255,255,.95),rgba(255,255,255,0) 70%);filter:blur(3px)}
.orb.idle{animation:orbbreathe 5.5s ease-in-out infinite}.orb.idle .g{animation:orbglow 5.5s ease-in-out infinite}
.ex{display:flex;flex-direction:column;align-items:flex-start;gap:14px;border-radius:24px;padding:20px;text-align:left;cursor:pointer}
.ex .ic{width:48px;height:48px;border-radius:15px;background:#E8F2FB;color:#125D99;display:flex;align-items:center;justify-content:center;font-size:24px}
@keyframes orbspin{to{transform:rotate(360deg)}}
@keyframes orbbreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
@keyframes orbglow{0%,100%{opacity:.7}50%{opacity:1}}
</style>
<div class="root stage" style="width: 1366px; height: 1024px; padding: 20px">
  <i class="blob" style="width: 700px; height: 700px; left: -220px; top: -260px; background: #2694CF"></i>
  <i class="blob" style="width: 640px; height: 640px; right: -240px; top: 300px; background: #125D99"></i>
  <i class="blob" style="width: 700px; height: 700px; left: 300px; bottom: -480px; background: #1EA5E0"></i>
  <div class="canvas" style="height: 100%; border-radius: 40px; padding: 28px 48px 36px">
    <header style="display: flex; align-items: center; justify-content: space-between; height: 64px">
      <img src="../assets/mcg-mark-color.png" alt="MCG" style="height: 44px; width: auto; display: block">
      <div class="seg"><button class="on">EN</button><button class="ar" style="font-size: 17px">عربي</button></div>
    </header>

    <div style="flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 48px; align-items: center">
      <div style="position: relative; height: 480px; display: flex; align-items: center; justify-content: center">
        <svg class="bline" viewBox="0 0 560 480" style="left: -48px; top: 0; width: 600px; height: 480px" aria-hidden="true"><path d="M20 380 C 90 380 110 240 190 280 S 280 380 320 260 S 420 90 500 170 S 560 240 590 120" fill="none" stroke="#144074" stroke-width="2.5" stroke-linecap="round"><animate attributeName="d" dur="7s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines=".45 0 .55 1;.45 0 .55 1" values="M20 380 C 90 380 110 240 190 280 S 280 380 320 260 S 420 90 500 170 S 560 240 590 120;M20 380 C 90 135 110 240 190 210 S 280 135 320 225 S 420 352.5 500 292.5 S 560 240 590 120;M20 380 C 90 380 110 240 190 280 S 280 380 320 260 S 420 90 500 170 S 560 240 590 120"></animate></path><circle cx="20" cy="380" r="9" fill="#E5418C"><animate attributeName="r" dur="2.4s" repeatCount="indefinite" values="9;12.2;9"></animate></circle><circle cx="590" cy="120" r="9" fill="#EF8E0A"><animate attributeName="r" dur="2.4s" repeatCount="indefinite" values="9;12.2;9"></animate></circle></svg>
        <div class="orb idle" style="width: 340px; height: 340px"><i class="g"></i><i class="c"></i><i class="s"></i><i class="s2"></i><i class="h"></i></div>
      </div>

      <div style="display: flex; flex-direction: column">
        <div class="grad" style="font-size: 44px; font-weight: 600">Hello<span class="dots"><i></i><i></i><i></i></span></div>
        <h1 style="margin-top: 6px; font-size: 54px; line-height: 1.08; font-weight: 700; letter-spacing: -0.02em; text-wrap: balance">Tell us about your business. We'll build your campaign.</h1>
        <a class="btn1" href="02-listening.html" style="margin-top: 40px; align-self: flex-start; width: 380px; height: 88px; font-size: 24px; gap: 14px; box-shadow: 0 14px 32px rgba(20,64,116,.28)">
          <svg class="i" viewBox="0 0 24 24" style="font-size: 28px"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"></path><path d="M19 11a7 7 0 0 1-14 0M12 18v3"></path></svg>Hold to talk
        </a>
        <span class="lbl" style="margin-top: 52px; font-size: 14px">Examples</span>
        <div style="margin-top: 14px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px">
          <button class="card ex"><span class="ic"><svg class="i" viewBox="0 0 24 24"><path d="M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V9z"></path><path d="M17 11h1.5a2.5 2.5 0 0 1 0 5H17"></path><path d="M8 3v3M12 3v3"></path></svg></span><span style="font-size: 18px; font-weight: 700; line-height: 1.2">Café happy hour</span></button>
          <button class="card ex"><span class="ic"><svg class="i" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg></span><span style="font-size: 18px; font-weight: 700; line-height: 1.2">Ramadan campaign</span></button>
          <button class="card ex"><span class="ic"><svg class="i" viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6L5 8z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg></span><span style="font-size: 18px; font-weight: 700; line-height: 1.2">Online sales</span></button>
        </div>
      </div>
    </div>

    <footer class="muted" style="text-align: center; font-size: 14px; font-weight: 500">Advertising. Content. Events. AI.</footer>
  </div>
</div>
</body>
</html>
