<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPad · Listening</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;family=Montserrat:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}*{box-sizing:border-box}p,h1,h2,h3{margin:0}
.root{font-family:'Montserrat',ui-sans-serif,system-ui,sans-serif;color:#144074;-webkit-font-smoothing:antialiased}
.ar{font-family:'IBM Plex Sans Arabic','Montserrat',sans-serif}
button,input{font:inherit;color:inherit}
.stage{position:relative;overflow:hidden;background:#144074}
.blob{position:absolute;display:block;border-radius:50%;filter:blur(90px);opacity:.55}
.canvas{position:relative;background:#fff;display:flex;flex-direction:column;box-shadow:0 20px 70px rgba(10,30,70,.25)}
.seg{display:flex;background:#EEF2F7;border-radius:999px;gap:3px;padding:4px}
.seg button,.seg a{border:0;background:transparent;font-weight:600;color:#4E5F78;border-radius:999px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none;min-width:72px;height:48px;font-size:16px}
.seg .on{background:#144074;color:#fff}
.btn1{display:inline-flex;align-items:center;justify-content:center;background:#144074;color:#fff;border:0;border-radius:999px;font-weight:600;text-decoration:none;cursor:pointer}
.btn2{display:inline-flex;align-items:center;justify-content:center;background:#fff;color:#144074;border:1.5px solid #D9E2EC;border-radius:999px;font-weight:600;text-decoration:none;cursor:pointer}
.muted{color:#4E5F78}
.ring{display:inline-block;flex:none;border-radius:50%;background:conic-gradient(#2694CF 0 72%,#DFE9F3 72% 100%);-webkit-mask:radial-gradient(circle,transparent 52%,#000 54%);mask:radial-gradient(circle,transparent 52%,#000 54%)}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.orb{position:relative;border-radius:50%;flex:none}
.orb>i{position:absolute;display:block;border-radius:50%}
.orb .g{inset:-24%;background:radial-gradient(circle,rgba(38,148,207,.55) 0%,rgba(140,202,238,.22) 42%,rgba(140,202,238,0) 68%);filter:blur(16px)}
.orb .c{inset:0;background:radial-gradient(circle at 34% 28%,#fff 0%,#E2F2FC 12%,#8CCAEE 36%,#2694CF 64%,#144074 92%);box-shadow:inset 0 -30px 70px rgba(10,45,95,.32),inset 0 20px 40px rgba(255,255,255,.5)}
.orb .s{inset:8%;background:conic-gradient(from 0deg,rgba(255,255,255,0) 0deg,rgba(160,220,255,.85) 90deg,rgba(229,65,140,.35) 200deg,rgba(255,255,255,0) 300deg);filter:blur(14px);mix-blend-mode:screen;opacity:.75;animation:orbspin 14s linear infinite}
.orb .s2{inset:16%;background:conic-gradient(from 180deg,rgba(255,255,255,0) 0deg,rgba(130,205,255,.7) 120deg,rgba(239,142,10,.35) 220deg,rgba(255,255,255,0) 320deg);filter:blur(12px);mix-blend-mode:screen;animation:orbspin 9s linear infinite reverse}
.orb .h{top:8%;left:19%;width:42%;height:26%;background:radial-gradient(ellipse at center,rgba(255,255,255,.95),rgba(255,255,255,0) 70%);filter:blur(3px)}
.orb .r{inset:-3%;border:2px solid rgba(38,148,207,.45);animation:orbring 2.4s ease-out infinite}
.orb.listen{animation:orblisten 1.1s ease-in-out infinite}.orb.listen .g{inset:-34%}
.dot{display:inline-block;flex:none;border-radius:50%;background:#E5418C;animation:blink 1.2s ease-in-out infinite}
.caret{display:inline-block;width:3px;background:#2694CF;vertical-align:middle;animation:blink 1s steps(2) infinite}
.wave{display:flex;align-items:center}.wave i{display:block;background:#2694CF;border-radius:99px;animation:wv 1s ease-in-out infinite}
@keyframes orbspin{to{transform:rotate(360deg)}}
@keyframes orblisten{0%,100%{transform:scale(1)}20%{transform:scale(1.08)}45%{transform:scale(.98)}70%{transform:scale(1.11)}}
@keyframes orbring{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.6);opacity:0}}
@keyframes blink{50%{opacity:.25}}
@keyframes wv{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
</style>
<div class="root stage" style="width: 1366px; height: 1024px; padding: 20px">
  <i class="blob" style="width: 700px; height: 700px; left: -220px; top: -260px; background: #2694CF"></i>
  <i class="blob" style="width: 640px; height: 640px; right: -240px; top: 300px; background: #125D99"></i>
  <i class="blob" style="width: 700px; height: 700px; left: 300px; bottom: -480px; background: #1EA5E0"></i>
  <div class="canvas" style="height: 100%; border-radius: 40px; padding: 28px 48px 36px">
    <header style="display: flex; align-items: center; justify-content: space-between; height: 64px">
      <img src="../assets/mcg-mark-color.png" alt="MCG" style="height: 44px; width: auto; display: block">
      <div style="display: flex; align-items: center; gap: 12px">
        <a class="btn2" href="01-welcome.html" style="height: 52px; padding: 0 20px; font-size: 16px; gap: 8px"><svg class="i" viewBox="0 0 24 24" style="font-size: 18px"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path></svg>Start over</a>
        <div class="seg"><button class="on">EN</button><button class="ar" style="font-size: 17px">عربي</button></div>
      </div>
    </header>

    <div style="flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 56px; align-items: center">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 48px">
        <div class="orb listen" style="width: 340px; height: 340px"><i class="g"></i><i class="r"></i><i class="r" style="animation-delay: .8s"></i><i class="r" style="animation-delay: 1.6s"></i><i class="c"></i><i class="s"></i><i class="s2"></i><i class="h"></i></div>
        <div style="display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 700"><span class="dot" style="width: 12px; height: 12px"></span>Listening<span class="muted" style="font-weight: 500; font-variant-numeric: tabular-nums">00:07</span></div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 40px">
        <div class="wave" style="height: 48px; gap: 5px">
          <i style="width: 5px; height: 16px; animation-delay: -.1s"></i><i style="width: 5px; height: 30px; animation-delay: -.5s"></i><i style="width: 5px; height: 42px; animation-delay: -.2s"></i><i style="width: 5px; height: 24px; animation-delay: -.7s"></i><i style="width: 5px; height: 46px; animation-delay: -.3s"></i><i style="width: 5px; height: 34px; animation-delay: -.9s"></i><i style="width: 5px; height: 48px; animation-delay: -.4s"></i><i style="width: 5px; height: 28px; animation-delay: -.6s"></i><i style="width: 5px; height: 40px; animation-delay: -.15s"></i><i style="width: 5px; height: 20px; animation-delay: -.8s"></i><i style="width: 5px; height: 36px; animation-delay: -.35s"></i><i style="width: 5px; height: 18px; animation-delay: -.25s"></i>
        </div>
        <p style="font-size: 40px; line-height: 1.25; font-weight: 600; letter-spacing: -0.01em; text-wrap: pretty">I have a specialty coffee shop in Salmiya, and I want more people <span style="color: #8796AB">in the evenings</span><span class="caret" style="height: 40px; margin-left: 4px"></span></p>
        <div style="display: flex; gap: 14px">
          <a class="btn2" href="01-welcome.html" style="height: 88px; padding: 0 36px; font-size: 20px">Cancel</a>
          <a class="btn1" href="03-conversation.html" style="flex: 1; height: 88px; font-size: 24px; gap: 14px; box-shadow: 0 0 0 8px #D3E8F6, 0 14px 32px rgba(20,64,116,.28)">
            <span class="wave" style="height: 26px; gap: 4px"><i style="width: 4px; height: 12px; background: #fff"></i><i style="width: 4px; height: 24px; background: #fff; animation-delay: -.4s"></i><i style="width: 4px; height: 18px; background: #fff; animation-delay: -.7s"></i><i style="width: 4px; height: 26px; background: #fff; animation-delay: -.2s"></i></span>Release to send
          </a>
        </div>
      </div>
    </div>

    <footer class="muted" style="display: flex; justify-content: flex-end; align-items: center; gap: 8px; font-size: 14px; font-weight: 500"><span class="ring" style="width: 20px; height: 20px"></span>60s</footer>
  </div>
</div>
</body>
</html>
