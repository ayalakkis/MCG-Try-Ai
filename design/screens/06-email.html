<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPad · Email capture</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;family=Montserrat:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}*{box-sizing:border-box}p,h1,h2,h3{margin:0}
.root{font-family:'Montserrat',ui-sans-serif,system-ui,sans-serif;color:#144074;-webkit-font-smoothing:antialiased}
.ar{font-family:'IBM Plex Sans Arabic','Montserrat',sans-serif}
button,input{font:inherit;color:inherit}
.stage{position:relative;overflow:hidden;background:#144074}
.blob{position:absolute;display:block;border-radius:50%;filter:blur(90px);opacity:.55}
.canvas{position:relative;background:#fff;display:flex;flex-direction:column;box-shadow:0 20px 70px rgba(10,30,70,.25)}
.seg{display:flex;background:#EEF2F7;border-radius:999px;gap:3px;padding:4px}
.seg button,.seg a{border:0;background:transparent;font-weight:600;color:#4E5F78;border-radius:999px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none;min-width:72px;height:48px;font-size:16px}
.seg .on{background:#144074;color:#fff}
.btn1{display:inline-flex;align-items:center;justify-content:center;background:#144074;color:#fff;border:0;border-radius:999px;font-weight:600;text-decoration:none;cursor:pointer}
.btn2{display:inline-flex;align-items:center;justify-content:center;background:#fff;color:#144074;border:1.5px solid #D9E2EC;border-radius:999px;font-weight:600;text-decoration:none;cursor:pointer}
.chip{display:inline-flex;align-items:center;background:#E8F2FB;color:#125D99;border-radius:999px;font-weight:600;white-space:nowrap;border:0;cursor:pointer}
.muted{color:#4E5F78}
.grad{background:linear-gradient(90deg,#2694CF,#125D99);-webkit-background-clip:text;background-clip:text;color:transparent}
.dots{display:inline-flex;align-items:center;gap:.09em;margin-inline-start:.12em;vertical-align:baseline}
.dots i{display:block;width:.19em;height:.19em;border-radius:50%}
.dots i:nth-child(1){background:#EF8E0A}.dots i:nth-child(2){background:#E5418C}.dots i:nth-child(3){background:#1EA5E0}
.ring{display:inline-block;flex:none;border-radius:50%;background:conic-gradient(#2694CF 0 72%,#DFE9F3 72% 100%);-webkit-mask:radial-gradient(circle,transparent 52%,#000 54%);mask:radial-gradient(circle,transparent 52%,#000 54%)}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.orb{position:relative;border-radius:50%;flex:none}
.orb>i{position:absolute;display:block;border-radius:50%}
.orb .g{inset:-24%;background:radial-gradient(circle,rgba(38,148,207,.55) 0%,rgba(140,202,238,.22) 42%,rgba(140,202,238,0) 68%);filter:blur(16px)}
.orb .c{inset:0;background:radial-gradient(circle at 34% 28%,#fff 0%,#E2F2FC 12%,#8CCAEE 36%,#2694CF 64%,#144074 92%);box-shadow:inset 0 -24px 56px rgba(10,45,95,.32),inset 0 16px 32px rgba(255,255,255,.5)}
.orb .s{inset:8%;background:conic-gradient(from 0deg,rgba(255,255,255,0) 0deg,rgba(160,220,255,.85) 90deg,rgba(229,65,140,.35) 200deg,rgba(255,255,255,0) 300deg);filter:blur(12px);mix-blend-mode:screen;opacity:.75;animation:orbspin 14s linear infinite}
.orb .s2{inset:16%;background:conic-gradient(from 180deg,rgba(255,255,255,0) 0deg,rgba(130,205,255,.7) 120deg,rgba(239,142,10,.35) 220deg,rgba(255,255,255,0) 320deg);filter:blur(10px);mix-blend-mode:screen;animation:orbspin 9s linear infinite reverse}
.orb .h{top:8%;left:19%;width:42%;height:26%;background:radial-gradient(ellipse at center,rgba(255,255,255,.95),rgba(255,255,255,0) 70%);filter:blur(3px)}
.orb.speak{animation:orbspeak 1.4s ease-in-out infinite}.orb.speak .g{animation:orbglow 1.4s ease-in-out infinite}
.field{display:flex;flex-direction:column;gap:10px}
.field label{font-size:17px;font-weight:600}
.field label em{font-style:normal;font-weight:500;color:#4E5F78}
.inp{height:68px;border-radius:20px;border:1.5px solid #D9E2EC;background:#fff;padding:0 22px;font-size:21px;font-weight:500;width:100%}
@keyframes orbspin{to{transform:rotate(360deg)}}
@keyframes orbglow{0%,100%{opacity:.7}50%{opacity:1}}
@keyframes orbspeak{0%,100%{transform:scale(1)}12%{transform:scale(1.06)}24%{transform:scale(1.01)}36%{transform:scale(1.07)}52%{transform:scale(1)}68%{transform:scale(1.05)}84%{transform:scale(1.01)}}
</style>
<div class="root stage" style="width: 1366px; height: 1024px; padding: 20px">
  <i class="blob" style="width: 700px; height: 700px; left: -220px; top: -260px; background: #2694CF"></i>
  <i class="blob" style="width: 640px; height: 640px; right: -240px; top: 300px; background: #125D99"></i>
  <i class="blob" style="width: 700px; height: 700px; left: 300px; bottom: -480px; background: #1EA5E0"></i>
  <div class="canvas" style="height: 100%; border-radius: 40px; padding: 28px 48px 36px">
    <header style="display: flex; align-items: center; justify-content: space-between; height: 64px">
      <img src="../assets/mcg-mark-color.png" alt="MCG" style="height: 44px; width: auto; display: block">
      <div style="display: flex; align-items: center; gap: 12px">
        <a class="btn2" href="01-welcome.html" style="height: 52px; padding: 0 20px; font-size: 16px; gap: 8px"><svg class="i" viewBox="0 0 24 24" style="font-size: 18px"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path></svg>Start over</a>
        <div class="seg"><button class="on">EN</button><button class="ar" style="font-size: 17px">عربي</button></div>
      </div>
    </header>

    <div style="flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 64px; align-items: start; padding-top: 72px">
      <div style="display: flex; flex-direction: column">
        <div class="orb speak" style="width: 150px; height: 150px"><i class="g"></i><i class="c"></i><i class="s"></i><i class="s2"></i><i class="h"></i></div>
        <div class="grad" style="margin-top: 40px; font-size: 32px; font-weight: 600">Almost done<span class="dots"><i></i><i></i><i></i></span></div>
        <h1 style="margin-top: 6px; font-size: 58px; line-height: 1.06; font-weight: 700; letter-spacing: -0.02em">Where should we send it?</h1>
      </div>

      <form style="display: flex; flex-direction: column; gap: 22px">
        <div class="field">
          <label for="i-email">Email</label>
          <input id="i-email" class="inp" type="email" inputmode="email" autocomplete="email" value="sara.alenezi@gmail.com" style="height: 76px; font-size: 24px; border: 2.5px solid #2694CF; box-shadow: 0 0 0 6px #DCEDF8">
          <div style="display: flex; gap: 10px">
            <button type="button" class="chip" style="height: 48px; padding: 0 18px; font-size: 16px">@gmail.com</button>
            <button type="button" class="chip" style="height: 48px; padding: 0 18px; font-size: 16px">@outlook.com</button>
            <button type="button" class="chip" style="height: 48px; padding: 0 18px; font-size: 16px">@icloud.com</button>
          </div>
        </div>
        <div class="field"><label for="i-name">Name <em>(optional)</em></label><input id="i-name" class="inp" autocomplete="name" value="Sara"></div>
        <label style="display: flex; align-items: center; gap: 14px; font-size: 19px; font-weight: 500; cursor: pointer; min-height: 48px">
          <input type="checkbox" checked="" style="width: 28px; height: 28px; margin: 0; accent-color: #144074; flex: none">MCG can contact me
        </label>
        <a class="btn1" href="07-thanks.html" style="height: 80px; font-size: 22px; gap: 12px; box-shadow: 0 14px 32px rgba(20,64,116,.28)">Send<svg class="i" viewBox="0 0 24 24" style="font-size: 24px"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
        <p class="muted" style="text-align: center; font-size: 15px">We never share your email · <a href="#" style="color: #125D99">Privacy</a></p>
      </form>
    </div>

    <footer class="muted" style="display: flex; justify-content: flex-end; align-items: center; gap: 8px; font-size: 14px; font-weight: 500"><span class="ring" style="width: 20px; height: 20px"></span>90s</footer>
  </div>
</div>
</body>
</html>
